<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Depot Box Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#5b6573;--bd:#d7dce3;--ok:#0f7b3f;--okbg:#dff3e6;--wr:#9a5b00;--wrbg:#fff0d1;--er:#b3261e;--erbg:#fde3e1;--ac:#1c5fd4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--card:#1a1f28;--tx:#eef1f5;--mut:#9aa5b4;--bd:#2d3542;--ok:#6fdc9b;--okbg:#123a25;--wr:#ffc766;--wrbg:#3d2c0a;--er:#ff9a92;--erbg:#431714;--ac:#7aa7ff}}
:root[data-theme="dark"]{--bg:#101319;--card:#1a1f28;--tx:#eef1f5;--mut:#9aa5b4;--bd:#2d3542;--ok:#6fdc9b;--okbg:#123a25;--wr:#ffc766;--wrbg:#3d2c0a;--er:#ff9a92;--erbg:#431714;--ac:#7aa7ff}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
select,input,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
button{cursor:pointer}button:active{opacity:.7}
#scan{width:100%;font-size:26px;text-align:center;border:2px solid var(--ac);letter-spacing:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.row>*{flex:1 1 90px}
#res{margin:12px 0;border-radius:16px;padding:16px;text-align:center;background:var(--card);border:2px solid var(--bd);min-height:200px;display:flex;flex-direction:column;justify-content:center}
#res.ok{background:var(--okbg);border-color:var(--ok)}#res.wr{background:var(--wrbg);border-color:var(--wr)}#res.er{background:var(--erbg);border-color:var(--er)}
.big{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.big div{min-width:90px}.big b{display:block;font-size:64px;line-height:1}.big span{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.nm{font-size:20px;margin-top:10px;font-weight:600}.msg{font-size:15px;margin-top:6px}
.ok .msg{color:var(--ok)}.wr .msg{color:var(--wr)}.er .msg,.er .nm{color:var(--er)}
.stats{display:flex;gap:8px;margin-bottom:10px}.stats div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}
.stats b{font-size:22px;display:block}.stats span{font-size:12px;color:var(--mut)}
h2{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:4px 10px;font-size:14px}.chip.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
ul{list-style:none;margin:0;padding:0}li{display:flex;justify-content:space-between;gap:8px;padding:7px 4px;border-bottom:1px solid var(--bd);font-size:15px}
li.er{color:var(--er)}li.wr{color:var(--wr)}li small{color:var(--mut)}
textarea{width:100%;height:120px;margin-top:8px;font:12px monospace}
#reader{border-radius:12px;overflow:hidden;margin:8px 0;max-width:100%;border:2px solid var(--ac)}#reader video{width:100%!important;max-height:240px;object-fit:cover}.big .r b{font-size:84px;color:var(--tx)}.big .r{min-width:130px}
.hint{color:var(--mut);font-size:13px;margin-top:4px;text-align:center}
#lock{max-width:420px;margin:12vh auto 0;padding:20px;text-align:center}
#lock input{width:100%;font-size:22px;text-align:center;margin:12px 0;border:2px solid var(--ac)}
#lock button{width:100%;font-weight:600}#lockmsg{color:var(--er);min-height:22px;font-size:15px}
</style></head><body><div id="lock"><h1>Depot Box Scanner</h1><p class="hint">Enter the passcode you were given to unlock the lookup data.</p>
<input id="pw" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Passcode" aria-label="Passcode">
<button id="unlock">Unlock</button><div id="lockmsg"></div></div>
<main id="app" hidden>
<div class="top"><h1>Depot Box Scanner</h1><select id="depot" aria-label="Depot"></select></div>
<input id="scan" inputmode="numeric" enterkeyhint="go" autocomplete="off" autofocus placeholder="Scan or type client ID" aria-label="Client ID">
<button id="go" style="width:100%;margin-top:8px;font-weight:600">Look up</button>
<div class="hint">Scanner types the ID and presses Enter. Tap the box if it loses focus.</div>
<div id="reader" hidden></div><div id="tmp" hidden></div>
<div id="res"><div class="msg">Ready to scan</div></div>
<div class="stats"><div><b id="sTot">0</b><span>boxes scanned</span></div><div><b id="sDep">0</b><span id="sDepL">in depot</span></div><div><b id="sBad">0</b><span>problems</span></div></div>
<div class="row"><button id="undo">Undo last</button><button id="cam">Camera</button><button id="photo">Photo scan</button><input id="file" type="file" accept="image/*" capture="environment" hidden><button id="copy">Copy log</button><button id="clr">Clear</button></div>
<textarea id="ta" hidden readonly></textarea>
<h2>Routes in progress</h2><div id="routes" class="chips"></div>
<h2>Recent scans</h2><ul id="hist"></ul>
</main>
<script>
function start(D){
const byId=new Map(D.map(r=>[r[0],{id:r[0],depot:r[1],route:r[2],stop:r[3],name:r[4],qty:r[5]}]));
const tot={};D.forEach(r=>{const k=r[1]+'|'+r[2];tot[k]=(tot[k]||0)+r[5]});
const depots=[...new Set(D.map(r=>r[1]))].sort();
const $=i=>document.getElementById(i);
let scans=[],depot='ALL';
try{scans=JSON.parse(localStorage.getItem('dbs2_scans')||'[]');depot=localStorage.getItem('dbs_depot')||'ALL'}catch(e){}
const save=()=>{try{localStorage.setItem('dbs2_scans',JSON.stringify(scans));localStorage.setItem('dbs_depot',depot)}catch(e){}};
$('depot').innerHTML='<option value="ALL">All depots</option>'+depots.map(d=>`<option value="${d}">Depot ${d}</option>`).join('');
$('depot').value=depot;
let ac;function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(cls,html){const r=$('res');r.className=cls;r.innerHTML=html}
function boxNo(id){return scans.filter(s=>s.id===id&&s.ok!=='er').length}
function handle(raw){
  const digits=String(raw).replace(/\D/g,'');if(!digits)return;
  const id=parseInt(digits.slice(-6),10),rec=byId.get(id),t=Date.now();
  if(!rec){scans.push({t,id,ok:'er',msg:'Not found'});beep(200,.5);navigator.vibrate&&navigator.vibrate(300);
    show('er',`<div class="nm">ID ${id} not found</div><div class="msg">Not in any depot list. Set the box aside.</div>`)}
  else{
    const n=boxNo(id)+1;let ok='ok',msg=`Box ${n} of ${rec.qty}`;
    if(depot!=='ALL'&&rec.depot!==depot){ok='wr';msg=`Belongs to depot ${rec.depot}, not ${depot}`}
    else if(n>rec.qty){ok='wr';msg=`Extra box: all ${rec.qty} already scanned`}
    else if(n===rec.qty&&rec.qty>1)msg+=' (last one)';
    if(!rec.route){ok='wr';msg='No route assigned for this client. Set the box aside.'}
    scans.push({t,id,depot:rec.depot,route:rec.route,stop:rec.stop,name:rec.name,ok,n,qty:rec.qty,msg});
    beep(ok==='ok'?880:330,ok==='ok'?.12:.4);
    show(ok,`<div class="big"><div class="r"><b>${rec.route||'?'}</b><span>Route / run</span></div><div><b>${rec.depot}</b><span>Depot</span></div><div><b>${rec.stop}</b><span>Stop</span></div></div><div class="nm">${esc(rec.name)}</div><div class="msg">${esc(msg)}</div>`)}
  save();render();
}
function render(){
  const good=scans.filter(s=>s.ok!=='er'&&s.ok!=='wr'||s.ok==='ok');
  $('sTot').textContent=scans.filter(s=>s.ok==='ok'||s.ok==='wr').length;
  $('sDep').textContent=scans.filter(s=>s.ok==='ok'&&(depot==='ALL'||s.depot===depot)).length;
  $('sDepL').textContent=depot==='ALL'?'matched':'in depot '+depot;
  $('sBad').textContent=scans.filter(s=>s.ok==='er'||s.ok==='wr').length;
  const cnt={};scans.filter(s=>s.ok==='ok').forEach(s=>{const k=s.depot+'|'+s.route;cnt[k]=(cnt[k]||0)+1});
  const keys=Object.keys(cnt).filter(k=>depot==='ALL'||k.split('|')[0]===depot).sort((a,b)=>{const[x,y]=[a.split('|'),b.split('|')];const nv=v=>parseInt((v.match(/\d+/)||[0])[0],10);return x[0]===y[0]?nv(x[1])-nv(y[1]):x[0]<y[0]?-1:1});
  $('routes').innerHTML=keys.length?keys.map(k=>{const[d,r]=k.split('|');return `<span class="chip${cnt[k]>=tot[k]?' done':''}">${depot==='ALL'?d+' ':''}${r}: ${cnt[k]}/${tot[k]}</span>`}).join(''):'<span class="hint">None yet</span>';
  $('hist').innerHTML=scans.slice(-40).reverse().map(s=>{const tm=new Date(s.t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    return s.ok==='er'?`<li class="er"><span>${s.id}: not found</span><small>${tm}</small></li>`:`<li class="${s.ok==='wr'?'wr':''}"><span>${s.depot} ${s.route||'no route'} S${s.stop} ${esc(s.name)} <small>(${s.n}/${s.qty})</small></span><small>${tm}</small></li>`}).join('')||'<li><small>No scans yet</small></li>';
}
$('scan').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();handle(e.target.value);e.target.value=''}});
$('depot').addEventListener('change',e=>{depot=e.target.value;save();render();$('scan').focus()});
$('undo').onclick=()=>{scans.pop();save();render();show('', '<div class="msg">Last scan removed</div>');$('scan').focus()};
$('clr').onclick=()=>{if(confirm('Clear all scans on this device?')){scans=[];save();render();show('','<div class="msg">Cleared</div>')}};
$('copy').onclick=async()=>{const txt='time,client_id,depot,route,stop,name,status,note\n'+scans.map(s=>[new Date(s.t).toISOString(),s.id,s.depot||'',s.route||'',s.stop||'',s.name||'',s.ok,s.msg||''].join(',')).join('\n');
  try{await navigator.clipboard.writeText(txt);show('','<div class="msg">Scan log copied</div>')}catch(e){const ta=$('ta');ta.hidden=false;ta.value=txt;ta.select()}};
let h5=null,camOn=false,lastV='',lastT=0;
async function stopCam(){if(h5){try{await h5.stop();h5.clear()}catch(e){}}h5=null;camOn=false;$('reader').hidden=true;$('cam').textContent='Camera'}
$('cam').onclick=async()=>{
  if(camOn){await stopCam();return}
  if(typeof Html5Qrcode==='undefined'){show('er','<div class="msg">Camera scanner could not load (check your connection). Use a hardware scanner or type the ID.</div>');return}
  $('reader').hidden=false;
  try{
    const F=Html5QrcodeSupportedFormats;
    h5=new Html5Qrcode('reader',{formatsToSupport:[F.CODE_39,F.CODE_128,F.CODE_93,F.ITF,F.EAN_13,F.QR_CODE,F.DATA_MATRIX],experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
    await h5.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:110}},txt=>{
      const now=Date.now();if(txt===lastV&&now-lastT<2000)return;lastV=txt;lastT=now;handle(txt)},()=>{});
    camOn=true;$('cam').textContent='Stop camera';
  }catch(e){
    h5=null;$('reader').hidden=true;
    show('er','<div class="msg">Camera did not start ('+esc((e&&e.name)||'error')+(e&&e.message?': '+esc(e.message):'')+'). '+(window.self!==window.top?'This page is embedded, which often blocks the camera. ':'')+'Use <b>Photo scan</b> instead (it opens your phone camera app), or a hardware scanner.</div>');
  }};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&camOn)stopCam()});
$('go').onclick=()=>{handle($('scan').value);$('scan').value='';$('scan').focus()};
const FMTS=()=>{const F=Html5QrcodeSupportedFormats;return [F.CODE_39,F.CODE_128,F.CODE_93,F.ITF,F.EAN_13,F.QR_CODE,F.DATA_MATRIX]};
$('photo').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  show('','<div class="msg">Reading photo...</div>');let val=null;
  try{if('BarcodeDetector' in window){const bmp=await createImageBitmap(f);const r=await new BarcodeDetector().detect(bmp);if(r.length)val=r[0].rawValue}}catch(x){}
  if(!val&&typeof Html5Qrcode!=='undefined'){try{const q=new Html5Qrcode('tmp',{formatsToSupport:FMTS(),verbose:false});val=await q.scanFile(f,false)}catch(x){}}
  if(val)handle(val);else show('er','<div class="msg">No barcode found in that photo. Fill the frame with the barcode, hold it flat and steady in good light, and try again.</div>');
};
render();$('scan').focus();

const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function decryptRows(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.i)},k,b64(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryUnlock(pw){
  const m=document.getElementById('lockmsg');
  if(!pw)return false;
  if(!(window.crypto&&crypto.subtle)){m.textContent='This browser blocks secure unlocking. Open the link in Chrome or Safari over https.';return false}
  m.textContent='Unlocking...';
  try{const rows=await decryptRows(pw.trim());
    try{sessionStorage.setItem('dbs_pw',pw.trim())}catch(e){}
    document.getElementById('lock').hidden=true;document.getElementById('app').hidden=false;start(rows);return true}
  catch(e){m.textContent='Wrong passcode. Try again.';return false}
}
document.getElementById('unlock').onclick=()=>tryUnlock(document.getElementById('pw').value);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock(e.target.value)});
try{const p=sessionStorage.getItem('dbs_pw');if(p)tryUnlock(p)}catch(e){}
</script></body></html>
